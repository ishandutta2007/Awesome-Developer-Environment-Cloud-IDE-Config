<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .glow-cyan {
        animation: pulseCyan 6s ease-in-out infinite alternate;
      }
      .glow-purple {
        animation: pulsePurple 7s ease-in-out infinite alternate;
      }
      .flow-stream {
        stroke-dasharray: 8 16;
        animation: flowDash 20s linear infinite;
      }
      .particle-1 {
        animation: floatParticle 8s ease-in-out infinite;
      }
      .particle-2 {
        animation: floatParticle 10s ease-in-out infinite reverse;
      }
      .pill-float {
        animation: hoverPill 4s ease-in-out infinite alternate;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes pulseCyan {
        0% { transform: scale(0.9) translate(0, 0); opacity: 0.5; }
        100% { transform: scale(1.15) translate(20px, 15px); opacity: 0.85; }
      }
      @keyframes pulsePurple {
        0% { transform: scale(1.1) translate(0, 0); opacity: 0.4; }
        100% { transform: scale(0.85) translate(-25px, -10px); opacity: 0.75; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-18px) translateX(12px); }
      }
      @keyframes hoverPill {
        0% { transform: translateY(0); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Dynamic Animated Glowing Orbs in Background -->
  <circle cx="200" cy="100" r="180" fill="url(#orbCyan)" class="glow-cyan" filter="blur(30px)"/>
  <circle cx="1020" cy="240" r="220" fill="url(#orbPurple)" class="glow-purple" filter="blur(35px)"/>
  <circle cx="600" cy="330" r="160" fill="url(#orbCyan)" class="glow-cyan" opacity="0.3" filter="blur(25px)"/>

  <!-- Dynamic Network Connection Streams -->
  <g opacity="0.35">
    <path d="M 50 80 Q 300 20 600 80 T 1150 70" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-stream"/>
    <path d="M 50 280 Q 400 340 750 270 T 1150 290" fill="none" stroke="#818cf8" stroke-width="1.5" class="flow-stream"/>
    <path d="M 150 320 Q 550 180 1050 310" fill="none" stroke="#c084fc" stroke-width="1" class="flow-stream" style="animation-duration: 28s;"/>
  </g>

  <!-- Floating Ambient Nodes -->
  <g opacity="0.6">
    <circle cx="140" cy="70" r="4" fill="#38bdf8" class="particle-1"/>
    <circle cx="1060" cy="90" r="3.5" fill="#818cf8" class="particle-2"/>
    <circle cx="1110" cy="280" r="5" fill="#38bdf8" class="particle-1"/>
    <circle cx="90" cy="270" r="3" fill="#c084fc" class="particle-2"/>
  </g>

  <!-- Foreground Title and Content (Strictly in foreground with crisp contrast) -->
  <g id="foreground-content">
    <!-- Top Category Tag / Badge -->
    <g transform="translate(600, 52)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
      <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2.5" text-anchor="middle">CLOUD WORKSPACES &amp; CDE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" fill="#ffffff" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.8">
      Awesome Developer Environment
    </text>
    <text x="600" y="180" fill="url(#accentGrad)" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="-0.5">
      &amp; Cloud IDE Config
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="222" fill="#94a3b8" font-size="15.5" font-weight="400" text-anchor="middle" letter-spacing="0.2">
      Curated guide to Cloud Development Environments (CDEs), DevContainers, Nix &amp; Browser IDEs
    </text>

    <!-- Dynamic Architectural Feature Pills (Foreground Layer) -->
    <g transform="translate(600, 276)" class="pill-float">
      <!-- Pill 1: DevContainers -->
      <g transform="translate(-360, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">📦 DevContainers</text>
      </g>
      <!-- Pill 2: Nix & Flox -->
      <g transform="translate(-180, 0)">
        <rect x="-55" y="-15" width="110" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">❄️ Nix Flakes</text>
      </g>
      <!-- Pill 3: Cloud CDEs -->
      <g transform="translate(0, 0)">
        <rect x="-60" y="-15" width="120" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
        <text x="0" y="5" fill="#38bdf8" font-size="12.5" font-weight="600" text-anchor="middle">☁️ Ephemeral CDEs</text>
      </g>
      <!-- Pill 4: WebContainers -->
      <g transform="translate(180, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">⚡ WebContainers</text>
      </g>
      <!-- Pill 5: AI Sandboxes -->
      <g transform="translate(360, 0)">
        <rect x="-60" y="-15" width="120" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="0" y="5" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">🤖 AI Sandboxes</text>
      </g>
    </g>

    <!-- Bottom Status Bar / Border Accent -->
    <rect x="300" y="328" width="600" height="2" rx="1" fill="url(#accentGrad)" opacity="0.6"/>
  </g>
</svg>