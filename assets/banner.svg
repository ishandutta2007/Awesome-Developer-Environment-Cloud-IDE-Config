<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0a0d14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d14"/><stop offset="50%" stop-color="#0e1726"/><stop offset="100%" stop-color="#070a10"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><radialGradient id="orbCyan" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="orbPurple" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#818cf8" stop-opacity=".3"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseCyan{0%{transform:scale(.9) translate(0,0);opacity:.5}}@keyframes pulsePurple{0%{transform:scale(1.1) translate(0,0);opacity:.4}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-18px) translateX(12px)}}@keyframes hoverPill{0%{transform:translateY(0)}}.glow-cyan{animation:pulseCyan 6s ease-in-out infinite alternate}.glow-purple{animation:pulsePurple 7s ease-in-out infinite alternate}.flow-stream{stroke-dasharray:8 16;animation:flowDash 20s linear infinite}.particle-1{animation:floatParticle 8s ease-in-out infinite}.particle-2{animation:floatParticle 10s ease-in-out infinite reverse}.pill-float{animation:hoverPill 4s ease-in-out infinite alternate}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#grid)"/><circle cx="200" cy="100" r="180" fill="url(#orbCyan)" class="glow-cyan" filter="blur(30px)"/><circle cx="1020" cy="240" r="220" fill="url(#orbPurple)" class="glow-purple" filter="blur(35px)"/><circle cx="600" cy="330" r="160" fill="url(#orbCyan)" class="glow-cyan" filter="blur(25px)" opacity=".3"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 50 80 Q 300 20 600 80 T 1150 70" class="flow-stream"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 50 280 Q 400 340 750 270 T 1150 290" class="flow-stream"/><path fill="none" stroke="#c084fc" stroke-width="1" d="M 150 320 Q 550 180 1050 310" class="flow-stream" style="animation-duration:28s"/></g><g opacity=".6"><circle cx="140" cy="70" r="4" fill="#38bdf8" class="particle-1"/><circle cx="1060" cy="90" r="3.5" fill="#818cf8" class="particle-2"/><circle cx="1110" cy="280" r="5" fill="#38bdf8" class="particle-1"/><circle cx="90" cy="270" r="3" fill="#c084fc" class="particle-2"/></g><g id="foreground-content"><g transform="translate(600, 52)"><rect width="380" height="32" x="-190" y="-16" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" rx="16"/><text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2.5" text-anchor="middle">CLOUD WORKSPACES &amp; CDE ECOSYSTEM</text></g><text x="600" y="132" fill="#fff" font-size="44" font-weight="800" letter-spacing="-.8" text-anchor="middle">Awesome Developer Environment</text><text x="600" y="180" fill="url(#accentGrad)" font-size="34" font-weight="700" letter-spacing="-.5" text-anchor="middle">&amp; Cloud IDE Config</text><text x="600" y="222" fill="#94a3b8" font-size="15.5" font-weight="400" letter-spacing=".2" text-anchor="middle">Curated guide to Cloud Development Environments (CDEs), DevContainers, Nix &amp; Browser IDEs</text><g class="pill-float"><g transform="translate(600, 276) translate(-360, 0)"><rect width="130" height="30" x="-65" y="-15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="15"/><text x="0" y="5" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">📦 DevContainers</text></g><g transform="translate(600, 276) translate(-180, 0)"><rect width="110" height="30" x="-55" y="-15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="15"/><text x="0" y="5" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">❄️ Nix Flakes</text></g><g transform="translate(600, 276) translate(0, 0)"><rect width="120" height="30" x="-60" y="-15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" rx="15"/><text x="0" y="5" fill="#38bdf8" font-size="12.5" font-weight="600" text-anchor="middle">☁️ Ephemeral CDEs</text></g><g transform="translate(600, 276) translate(180, 0)"><rect width="130" height="30" x="-65" y="-15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="15"/><text x="0" y="5" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">⚡ WebContainers</text></g><g transform="translate(600, 276) translate(360, 0)"><rect width="120" height="30" x="-60" y="-15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="15"/><text x="0" y="5" fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">🤖 AI Sandboxes</text></g></g><rect width="600" height="2" x="300" y="328" fill="url(#accentGrad)" opacity=".6" rx="1"/></g></svg>